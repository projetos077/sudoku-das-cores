<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6274">
  <title>Sudoku das Cores — Theo</title>
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="manifest" href="manifest-theo.json">
  <link rel="apple-touch-icon" href="icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <section class="phone trail-screen active" id="tela-trilha" aria-label="Trilha">
    <div class="mini-top"><span class="brand-dots" aria-hidden="true"><i style="--c:var(--blue)"></i><i style="--c:var(--yellow)"></i><i style="--c:var(--green)"></i><i style="--c:var(--purple)"></i></span><button class="settings" type="button" data-som aria-label="Desligar sons">⚙</button></div>
    <div class="trail-scroll"><div class="trail-map" id="mapa"><img src="ilustracoes/trilha-vasco.jpg" alt=""></div></div>
    <button class="next trail-play" id="jogar" type="button">Jogar <span aria-hidden="true">▶</span></button>
  </section>

  <section class="phone game-screen play-screen" id="tela-partida" data-set="frutas" aria-label="Partida">
    <div class="mini-top"><span class="brand-dots" aria-hidden="true"><i style="--c:var(--blue)"></i><i style="--c:var(--yellow)"></i><i style="--c:var(--green)"></i><i style="--c:var(--purple)"></i></span><button class="settings" type="button" data-som aria-label="Desligar sons">⚙</button></div><div class="chest" aria-hidden="true"><span class="chest-lid"></span><span class="chest-box"></span><span class="chest-coins"></span></div>
    <div class="screen-body"><div class="theo-topo"><img id="theo" src="ilustracoes/mascote-theo.png" alt="" aria-hidden="true"><span class="step" id="etapa">1/6</span></div><h2 class="wood-title">Desafio do dia</h2><div class="paper play-paper"><h1 class="sudoku-titulo" aria-label="Sudoku"><span style="--c:var(--blue)">S</span><span style="--c:var(--yellow)">U</span><span style="--c:var(--green)">D</span><span style="--c:var(--purple)">O</span><span style="--c:var(--blue)">K</span><span style="--c:var(--yellow)">U</span></h1><div class="board" id="tabuleiro" role="grid" aria-label="Tabuleiro"></div><div class="palette" id="paleta"><button type="button" data-c="0" aria-label="Azul"></button><button type="button" data-c="1" aria-label="Amarelo"></button><button type="button" data-c="2" aria-label="Verde"></button><button type="button" data-c="3" aria-label="Roxo"></button><button type="button" class="eraser" id="borracha" aria-label="Borracha"><svg viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-32 24 24)"><rect x="10" y="9" width="28" height="30" rx="5" fill="#F47791" stroke="#793F52" stroke-width="3"/><path d="M11 20h26" stroke="#FFF4DE" stroke-width="7"/><path d="M12 13h20" stroke="#FFB1C2" stroke-width="2" stroke-linecap="round"/><path d="M13 35h18" stroke="#D64F74" stroke-width="2" stroke-linecap="round"/></g></svg></button></div></div></div>
    <template data-set="frutas" data-k="0"><img class="piece" src="ilustracoes/pecas/frutas-0.png" alt=""></template><template data-set="frutas" data-k="1"><img class="piece" src="ilustracoes/pecas/frutas-1.png" alt=""></template><template data-set="frutas" data-k="2"><img class="piece" src="ilustracoes/pecas/frutas-2.png" alt=""></template><template data-set="frutas" data-k="3"><img class="piece" src="ilustracoes/pecas/frutas-3.png" alt=""></template><template data-set="bichos" data-k="0"><img class="piece" src="ilustracoes/pecas/bichos-0.png" alt=""></template><template data-set="bichos" data-k="1"><img class="piece" src="ilustracoes/pecas/bichos-1.png" alt=""></template><template data-set="bichos" data-k="2"><img class="piece" src="ilustracoes/pecas/bichos-2.png" alt=""></template><template data-set="bichos" data-k="3"><img class="piece" src="ilustracoes/pecas/bichos-3.png" alt=""></template><template data-set="tesouros" data-k="0"><img class="piece" src="ilustracoes/pecas/tesouros-0.png" alt=""></template><template data-set="tesouros" data-k="1"><img class="piece" src="ilustracoes/pecas/tesouros-1.png" alt=""></template><template data-set="tesouros" data-k="2"><img class="piece" src="ilustracoes/pecas/tesouros-2.png" alt=""></template><template data-set="tesouros" data-k="3"><img class="piece" src="ilustracoes/pecas/tesouros-3.png" alt=""></template><template data-set="dinos" data-k="0"><img class="piece" src="ilustracoes/pecas/dinos-0.png" alt=""></template><template data-set="dinos" data-k="1"><img class="piece" src="ilustracoes/pecas/dinos-1.png" alt=""></template><template data-set="dinos" data-k="2"><img class="piece" src="ilustracoes/pecas/dinos-2.png" alt=""></template><template data-set="dinos" data-k="3"><img class="piece" src="ilustracoes/pecas/dinos-3.png" alt=""></template><template data-set="carinhas" data-k="0"><svg class="piece face" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--blue)" stroke="#173b54" stroke-width="2.5"/><circle cx="14" cy="17" r="2.6" fill="#173b54"/><circle cx="26" cy="17" r="2.6" fill="#173b54"/><circle cx="15" cy="16" r=".9" fill="#fff"/><circle cx="27" cy="16" r=".9" fill="#fff"/><path d="M13 24q7 7 14 0" fill="none" stroke="#173b54" stroke-width="2.4" stroke-linecap="round"/><circle cx="10.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/><circle cx="29.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/></svg></template><template data-set="carinhas" data-k="1"><svg class="piece face" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--yellow)" stroke="#173b54" stroke-width="2.5"/><circle cx="14" cy="17" r="2.6" fill="#173b54"/><circle cx="26" cy="17" r="2.6" fill="#173b54"/><circle cx="15" cy="16" r=".9" fill="#fff"/><circle cx="27" cy="16" r=".9" fill="#fff"/><path d="M13 24q7 7 14 0" fill="none" stroke="#173b54" stroke-width="2.4" stroke-linecap="round"/><circle cx="10.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/><circle cx="29.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/></svg></template><template data-set="carinhas" data-k="2"><svg class="piece face" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--green)" stroke="#173b54" stroke-width="2.5"/><circle cx="14" cy="17" r="2.6" fill="#173b54"/><circle cx="26" cy="17" r="2.6" fill="#173b54"/><circle cx="15" cy="16" r=".9" fill="#fff"/><circle cx="27" cy="16" r=".9" fill="#fff"/><path d="M13 24q7 7 14 0" fill="none" stroke="#173b54" stroke-width="2.4" stroke-linecap="round"/><circle cx="10.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/><circle cx="29.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/></svg></template><template data-set="carinhas" data-k="3"><svg class="piece face" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--purple)" stroke="#173b54" stroke-width="2.5"/><circle cx="14" cy="17" r="2.6" fill="#173b54"/><circle cx="26" cy="17" r="2.6" fill="#173b54"/><circle cx="15" cy="16" r=".9" fill="#fff"/><circle cx="27" cy="16" r=".9" fill="#fff"/><path d="M13 24q7 7 14 0" fill="none" stroke="#173b54" stroke-width="2.4" stroke-linecap="round"/><circle cx="10.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/><circle cx="29.5" cy="23" r="2.4" fill="#ff8aa0" opacity=".6"/></svg></template>
  </section>

  <section class="phone win-screen" id="tela-vitoria" aria-label="Vitória do dia"><div class="rays" aria-hidden="true"></div><div class="fx" aria-hidden="true"></div><img class="hero" src="ilustracoes/mascote-theo.png" alt="">
    <div class="mini-top"><span class="brand-dots" aria-hidden="true"><i style="--c:var(--blue)"></i><i style="--c:var(--yellow)"></i><i style="--c:var(--green)"></i><i style="--c:var(--purple)"></i></span><button class="settings" type="button" data-som aria-label="Desligar sons">⚙</button></div>
    <div class="win-body">
      <div class="stars" id="estrelas" role="img"><span>★</span><span>★</span><span>★</span></div>
      <h2 class="win-banner" aria-label="Dia concluído!"><span style="--i:0">D</span><span style="--i:1">i</span><span style="--i:2">a</span><span style="--i:3">&nbsp;</span><span style="--i:4">c</span><span style="--i:5">o</span><span style="--i:6">n</span><span style="--i:7">c</span><span style="--i:8">l</span><span style="--i:9">u</span><span style="--i:10">í</span><span style="--i:11">d</span><span style="--i:12">o</span><span style="--i:13">!</span></h2>
      <div class="prizes" id="premios" aria-hidden="true"></div>
      <button class="next win-next" id="ate-amanha" type="button">Até amanhã <span aria-hidden="true">🌙</span></button>
    </div>
  </section>

  <section class="phone voice-screen" id="tela-recado" aria-label="Recados">
    <div class="mini-top"><span class="brand-dots" aria-hidden="true"><i style="--c:var(--blue)"></i><i style="--c:var(--yellow)"></i><i style="--c:var(--green)"></i><i style="--c:var(--purple)"></i></span><button class="settings" type="button" data-som aria-label="Desligar sons">⚙</button></div>
    <div class="screen-body"><h2 class="wood-title">Recados</h2><div class="paper voice-paper">
      <div class="msg" id="recado-pai" hidden><span class="avatar" style="background:#4b8197">P</span><button class="play-btn" id="ouvir" type="button" aria-label="Ouvir recado do papai">▶</button><span class="wave"><i id="barra"></i></span><span class="count" id="contagem" aria-hidden="true"></span></div>
      <div class="msg-gone" id="recado-ouvido" hidden>✓</div>
      <button class="mic" id="microfone" type="button" aria-label="Gravar recado para o papai"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <p class="mic-label" id="microfone-texto">Gravar para o papai</p>
    </div><button class="next" id="voltar-trilha" type="button">Trilha <span aria-hidden="true">▶</span></button></div>
  </section>

  <!-- Só aparece uma vez, na instalação: o pai digita aqui o código que o celular dele mostra. -->
  <section class="phone voice-screen" id="tela-parear" aria-label="Ligar ao celular do papai">
    <div class="screen-body"><h2 class="wood-title">Celular do papai</h2><div class="paper voice-paper">
      <p class="mic-label">Digite o código que aparece no celular do papai</p>
      <input id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" aria-label="Código de 6 números" style="width:9ch;padding:8px;border:3px solid #a96632;border-radius:12px;font-family:inherit;font-size:28px;font-weight:1000;letter-spacing:4px;text-align:center">
      <p class="mic-label" id="codigo-erro" hidden>Código não aceito. Peça um novo no celular do papai.</p>
    </div><button class="next" id="parear" type="button">Ligar <span aria-hidden="true">▶</span></button></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="jogos-revisados.js"></script>
  <script src="logica.js"></script>
  <script src="recados.js"></script>
  <script src="nuvem.js"></script>
  <script src="app.js?v=5"></script>
  <script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  // Pareamento (uma vez) e envio dos dados do dia ao celular do pai.
  (async () => {
    const N = window.Nuvem, $ = s => document.querySelector(s);
    if (!N) return; // sem internet: joga normal, envia quando abrir com rede
    const mostrar = id => document.querySelectorAll('.phone').forEach(t => t.classList.toggle('active', t.id === id));
    // Reenviar tudo é seguro (não duplica); se falhar, vai na próxima partida, ao voltar a rede ou ao abrir.
    const enviar = () => { try { N.sincronizar(JSON.parse(localStorage.getItem('sudoku-cores-theo-v2')) || { concluidos: [] }).catch(() => {}); } catch { /* sem dados */ } };
    let eu = null;
    try { eu = await N.iniciar(); } catch { return; }
    document.addEventListener('partida-salva', enviar);
    addEventListener('online', enviar);
    // Aviso de recado do papai: o pedido de permissão sai no toque em "Ligar" (ou no 1º "Jogar", se pareou antes disto).
    const avisos = pedir => N.ativarAvisos(pedir).catch(() => {});
    if (eu) {
      avisos(false); // renova a inscrição em silêncio
      if (window.Notification && Notification.permission === 'default') $('#jogar').addEventListener('click', () => avisos(true), { once: true });
      return enviar();
    }
    mostrar('tela-parear');
    $('#parear').addEventListener('click', async () => {
      const ok = await N.entrarFamilia($('#codigo').value).catch(() => false);
      $('#codigo-erro').hidden = ok;
      if (ok) { enviar(); avisos(true); mostrar('tela-trilha'); }
    });
  })();
  </script>
</body>
</html>
